name: Feature request
description: Suggest an idea or improvement for Orbitext
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Orbitext is an unofficial Telegram client, so features must stay within the Telegram API Terms of Service.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Orbitext do? Describe the behavior on the watch screen if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you thought about.
  - type: checkboxes
    id: tos
    attributes:
      label: Telegram API Terms of Service
      options:
        - label: This request does not conflict with the [Telegram API Terms of Service](https://core.telegram.org/api/terms) (for example it is not a ghost mode, fake online or read status, or a way to keep self-destructing content).
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
