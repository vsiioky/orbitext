name: Bug report
description: Report something that does not work as expected in Orbitext
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.

        Do not post phone numbers, login codes, api_id/api_hash values, or private message contents. Security problems must be reported privately, see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short summary of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: watch-model
    attributes:
      label: Apple Watch model
      options:
        - Series 9
        - Series 10
        - Series 11
        - Ultra 2
        - Ultra 3
        - SE (2nd gen)
        - SE (3rd gen)
        - Other
    validations:
      required: true
  - type: input
    id: watchos-version
    attributes:
      label: watchOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version and build
      description: Shown on the Settings screen of the app.
      placeholder: "1.0 (42)"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - TestFlight
        - App Store
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity
      description: How the watch was connected when the problem happened.
      options:
        - Wi-Fi
        - LTE
        - Via iPhone
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Attach screenshots or log excerpts. Remove personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true
