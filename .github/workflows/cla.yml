name: CLA Assistant

# Records contributor signatures for the Orbitext CLA (see CLA.md).
#
# This workflow uses pull_request_target so that it can write a status and a
# comment on pull requests from forks. That trigger runs with a privileged
# token, so this workflow never checks out or executes code from the pull
# request. It only reads the PR metadata and the comments through the GitHub
# API. Do not add an actions/checkout step for the PR head here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # Pinned to the commit of tag v2.6.1; dependabot proposes updates.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/vsiioky/orbitext/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'vsiioky,dependabot[bot],github-actions[bot]'
